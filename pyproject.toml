[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyentry"
version = "0.1.0"
description = "Linux desktop app for creating, validating, and installing .desktop files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
]

[project.scripts]
zyentry = "zyentry.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zyentry = ["resources/i18n/*.json", "resources/themes/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
